# ==============================================================================
# PPO Reinforcement Learning Configuration for Resource-Adaptive Federated KAN
# Reference: Section 3.2.4 & Section 3.2.5 of the Thesis Proposal
# ==============================================================================

# Telemetry State Configuration: S_i^t = [L_local^i, Var(x^i), Δτ^i, bw^i, H(y^i)]
telemetry:
  num_features: 5
  feature_names:
    - "local_loss"        # L_local: Cross-entropy loss on local client training batch
    - "input_variance"    # Var(x): Empirical input feature variance across ECG samples
    - "latency"           # Δτ: Wall-clock duration of local training step (seconds)
    - "bandwidth"         # bw: Simulated network link throughput (Mbps)
    - "label_entropy"     # H(y): Shannon entropy of local client label distribution (non-IID skew)
  normalization:
    loss_min: 0.0         # Normalization divisor for local loss: [0.0, 5.0] -> [-1.0, 1.0]
    loss_max: 5.0
    variance_min: 0.0     # Normalization divisor for feature variance: [0.0, 2.0] -> [-1.0, 1.0]
    variance_max: 2.0
    latency_min: 0.0      # Normalization divisor for step latency (seconds): [0.0, 10.0] -> [-1.0, 1.0]
    latency_max: 10.0
    bandwidth_min: 1.0    # Min bandwidth (Mbps): [1.0, 20.0] -> [-1.0, 1.0]
    bandwidth_max: 20.0   # Max bandwidth (Mbps) for high-compute nodes
    entropy_min: 0.0      # Min Shannon label entropy (monoculture non-IID) -> -1.0
    entropy_max: 1.6094   # Max Shannon label entropy ln(5) (uniform balanced IID) -> +1.0
  bandwidth_simulation:
    distribution: "uniform"   # "uniform" or "lognormal"
    min_mbps: 1.0
    max_mbps: 10.0
    lognormal_mu: 1.6         # Median ~5.0 Mbps
    lognormal_sigma: 0.5

# Discrete Action Space: a_i^t = (G_i^t, k_i^t) in {3, 5, 7, 10} x {2, 3, 4}
actions:
  grid_sizes: [3, 5, 7, 10]    # Spline interval resolution G
  spline_orders: [2, 3, 4]     # Spline polynomial degree k
  num_actions_per_client: 12   # 4 x 3 = 12 discrete configurations

# Strict Accuracy-Constrained Reward:
# R_t = R_acc + R_boost - ParamPenalty - LatencyPenalty - SmoothnessPenalty
reward:
  eval_split: "val"            # Evaluate on validation split for reward to prevent test set leakage
  accuracy_metric: "macro_f1"  # Headline metric: "macro_f1" or "balanced_accuracy" or "accuracy"
  scale_acc: 100.0             # Dimensionless scaling factor for positive accuracy improvement (acc_diff * 100.0)
  tolerance_threshold: 0.005   # 0.5% tolerance threshold for accuracy drop
  acc_penalty_mode: "exponential" # "exponential" (-10.0 * exp(|acc_diff|)) or "linear" (-10.0 * |acc_diff|)
  compression_booster_weight: 0.20 # Parameter compression ratio secondary booster weight (w_boost * CR)
  alpha_abs: 0.5               # Small absolute level reward term to guide policy towards higher accuracy
  transient_downweight: false  # Strict accuracy constraint active throughout all rounds
  beta1: 2.0                   # Asymmetric parameter penalty coefficient for exceeding budget
  beta2: 0.1                   # Normalized latency penalty coefficient
  beta3: 0.02                  # Action smoothness regularization coefficient: - β3 * ||a_t - a_{t-1}||_1
  delta_clip: 0.04             # Clip delta accuracy to [-0.04, 0.04] for stable value estimation
  reward_clip_min: -5.0        # Bound R_t in [-5.0, 5.0]
  reward_clip_max: 5.0
  baseline_params: 42792.0     # Reference baseline parameters (8 clients * 5349 params for G=5, k=3)
  baseline_budget: 42792.0     # Fleet reference baseline budget B_ref
  baseline_params_per_client: 5349.0
  target_budget_ratio: 1.0     # Target budget relative to B_ref (e.g. 1.0 for B_ref, 0.85 for 15% reduction)
  baseline_latency: 0.5        # Baseline client step latency (seconds)
  normalize_params: true       # Center parameter cost around baseline budget
  lambda1: 2.0                 # Compatibility alias for beta1
  lambda2: 0.1                 # Compatibility alias for beta2

# Aggregation and Action Space Configuration
aggregation:
  mode: "project_delta"        # "project_delta" (recommended), "project_full", "nested_grid", "compatible_actions_only"
  canonical_gk: [5, 3]
  compatible_threshold: 0.01

# Heuristic Fallback Controller Configuration (Section 4.2)
heuristic:
  weights:
    w1: 1.0       # Weight for local loss L_local
    w2: 1.0       # Weight for input variance Var(x)
    w3: 1.0       # Weight for inverse bandwidth 1 / bw
  quantiles:
    high_percentile: 75.0   # Top 25% complexity -> fine configuration (G=10, k=4)
    low_percentile: 25.0    # Bottom 25% complexity -> coarse configuration (G=3, k=2)
  configurations:
    high: [10, 4]           # Fine resolution (G=10, k=4)
    medium: [5, 3]          # Medium resolution (G=5, k=3)
    low: [3, 2]             # Coarse resolution (G=3, k=2)

# Gymnasium Environment Hyperparameters
environment:
  num_clients: 8               # N participating federated clients
  max_rounds: 10               # Maximum communication rounds per episode
  reference_grid_size: 5       # Server reference grid size G_ref
  reference_spline_order: 3    # Server reference spline degree k_ref
  reference_hidden: [32, 16, 5]# Input dim 32, hidden 16, 5 AAMI output classes
  alpha: 0.5                   # Non-IID Dirichlet skew for client data partitioning
  seed: 42

# Federated Client Training Setup within Environment
federated:
  local_epochs: 1              # Local epochs per round for fast RL training step
  batch_size: 32
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 1.0e-4
  aggregation: "fedavg"
  proximal_mu: 0.0
  round_timeout_seconds: 3.0   # Round deadline; client latency > timeout triggers straggler penalty
  straggler_handling: "aggregate_available"  # 'aggregate_available' (Option A) or 'stale_cache' (Option B)
  min_available_clients: 4     # Min responding clients required to aggregate
  stale_decay_factor: 0.9      # Decay factor for stale cached updates in Option B
  straggler_latency_penalty: 6.0  # Telemetry latency reported for stragglers

# Proximal Policy Optimization (PPO) Hyperparameters
ppo:
  learning_rate: 3.0e-4
  gamma: 0.99                  # Discount factor γ
  gae_lambda: 0.95             # Generalized Advantage Estimation λ
  clip_range: 0.2              # PPO surrogate objective clip parameter ε
  clip_range_vf: null
  ent_coef: 0.01               # Entropy regularization coefficient
  vf_coef: 0.5                 # Value function loss coefficient
  max_grad_norm: 0.5           # Gradient norm clipping
  total_timesteps: 20000
  n_steps: 128
  batch_size: 32
  n_epochs: 10
