# Federated Learning Configuration
federated:
  num_clients: 8
  num_rounds: 10
  fraction_fit: 1.0            # Client selection ratio per round (1.0 = all clients)
  fraction_evaluate: 1.0
  min_fit_clients: 8
  min_evaluate_clients: 8
  min_available_clients: 4     # Minimum responding clients needed to proceed
  aggregation: "fedavg"        # 'fedavg' or 'fedprox'
  proximal_mu: 0.01            # FedProx regularization parameter mu
  round_timeout_seconds: 3.0   # Round deadline in seconds; clients exceeding deadline become stragglers
  straggler_handling: "aggregate_available"  # 'aggregate_available' (Option A) or 'stale_cache' (Option B)
  stale_decay_factor: 0.9      # Stale parameter decay penalty for Option B
  straggler_latency_penalty: 6.0  # Telemetry latency penalty (s) assigned to timed-out stragglers

client:
  local_epochs: 3
  batch_size: 32
  optimizer: "adam"            # 'adam' or 'sgd'
  learning_rate: 0.001
  momentum: 0.9                # For SGD
  weight_decay: 1.0e-4
  loss_fn: "cross_entropy"

evaluation:
  evaluate_on_test: true
  metrics: ["accuracy", "macro_f1"]

results:
  output_dir: "results/baselines"
